<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ForgeBoard — dashboard pessoal de projetos e tarefas, local-first." />
    <meta name="theme-color" content="#4f46e5" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:title" content="ForgeBoard — Projetos & Tarefas" />
    <meta property="og:description" content="Workspace pessoal local-first: Kanban, calendário, pomodoro, estatísticas e backup — tudo no seu dispositivo." />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="ForgeBoard — Projetos & Tarefas" />
    <meta name="twitter:description" content="Dashboard pessoal de projetos e tarefas, 100% local-first e offline." />
    <title>ForgeBoard — Projetos & Tarefas</title>
    <script>
      // Tema pré-pintura (espelho síncrono de UserPreferences.theme): evita flash.
      try {
        var t = localStorage.getItem('forgeboard:theme');
        var dark = t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      } catch (e) {}
    </script>
    <style>
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        gap: 14px;
        align-items: center;
        justify-content: center;
        background: #f4f4f5;
      }
      @media (prefers-color-scheme: dark) {
        #boot-splash {
          background: #09090b;
          color: #f4f4f5;
        }
      }
      #boot-splash .mark {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 56px;
        height: 56px;
        border-radius: 16px;
        background: #4f46e5;
        color: #fff;
        font: 800 28px/1 system-ui, sans-serif;
      }
      #boot-splash .bar {
        width: 120px;
        height: 4px;
        border-radius: 999px;
        background: rgba(99, 102, 241, 0.25);
        overflow: hidden;
      }
      #boot-splash .bar > span {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: inherit;
        background: #4f46e5;
        animation: boot-slide 1s ease-in-out infinite alternate;
      }
      @keyframes boot-slide {
        from {
          transform: translateX(-30%);
        }
        to {
          transform: translateX(180%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash .bar > span {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot-splash" aria-hidden="true">
      <span class="mark">F</span>
      <span style="font: 600 14px system-ui, sans-serif">ForgeBoard</span>
      <span class="bar"><span></span></span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
