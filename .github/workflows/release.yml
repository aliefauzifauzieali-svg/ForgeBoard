# Release multi-plataforma: instaladores desktop (Tauri) + APK Android (Capacitor).
# Dispara ao criar uma tag `v*` (ex.: v1.3.0) ou manualmente (workflow_dispatch).
# iOS fora de escopo. A versão do app empacotado vem de `tauri.conf.json`
# (sincronize com a tag antes de criar a release).
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npm run build
      - run: npm run android:sync
      - name: Empacotar bundle web OTA
        run: python3 -c "import shutil; shutil.make_archive('forgeboard-web-${{ github.ref_name }}', 'zip', 'dist')"
      - run: cd android && ./gradlew assembleDebug
      - name: Renomear APK com a tag
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "forgeboard-${{ github.ref_name }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: apk-android
          path: forgeboard-*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: web-bundle
          path: forgeboard-web-*.zip
          if-no-files-found: error

  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Globs restritos aos distribuíveis (fora staging: .so, AppDir, etc.)
          - os: windows-latest
            artifact: desktop-windows
            files: |
              src-tauri/target/release/bundle/**/*.msi
              src-tauri/target/release/bundle/**/*-setup.exe
              src-tauri/target/release/bundle/**/*.sig
          - os: ubuntu-latest
            artifact: desktop-ubuntu
            files: |
              src-tauri/target/release/bundle/**/*.AppImage
              src-tauri/target/release/bundle/**/*.deb
              src-tauri/target/release/bundle/**/*.rpm
              src-tauri/target/release/bundle/**/*.sig
          - os: macos-latest
            artifact: desktop-macos-arm64
            files: |
              src-tauri/target/release/bundle/**/*.dmg
              src-tauri/target/release/bundle/**/*.app.tar.gz
              src-tauri/target/release/bundle/**/*.sig
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Dependências do Tauri (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file \
            libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            libwebkit2gtk-4.1-dev
      - run: npm ci
      - name: Build Tauri (gera .sig com a chave de assinatura)
        run: npm run tauri:build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    needs: [build-android, build-desktop]
    runs-on: ubuntu-latest
    steps:
      # Sem merge-multiple: cada artefato fica em dist-artifacts/<nome>,
      # preservando a origem (usada como fallback deSO/arch no latest.json).
      - uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
      - name: Gerar latest.json do updater (a partir dos .sig)
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python3 - <<'EOF'
          import datetime, json, os

          tag = os.environ.get('TAG_NAME', '')
          version = tag[1:] if tag.startswith('v') else tag
          repo = 'aliefauzifauzieali-svg/ForgeBoard'
          root = 'dist-artifacts'
          platforms = {}

          # Fallback de SO/arch pela pasta do artefato (ex.: desktop-macos-arm64).
          LEG_DEFAULTS = {
              'desktop-windows': ('windows', 'x86_64'),
              'desktop-ubuntu': ('linux', 'x86_64'),
              'desktop-macos-arm64': ('darwin', 'aarch64'),
          }

          def triple(filename, leg):
              low = filename.lower()
              if 'aarch64' in low or 'arm64' in low:
                  arch = 'aarch64'
              elif 'x64' in low or 'x86_64' in low or 'amd64' in low:
                  arch = 'x86_64'
              else:
                  arch = (LEG_DEFAULTS.get(leg) or (None, None))[1]
              if low.endswith('-setup.exe'):
                  return f'windows-{arch}' if arch else None
              if low.endswith('.appimage'):
                  return f'linux-{arch}' if arch else None
              if low.endswith('.app.tar.gz'):
                  return f'darwin-{arch}' if arch else None
              return None

          for dirpath, _, files in os.walk(root):
              leg = os.path.relpath(dirpath, root).split(os.sep)[0]
              for f in sorted(files):
                  if not f.endswith('.sig'):
                      continue
                  base = f[:-4]
                  key = triple(base, leg)
                  if key is None or not os.path.exists(os.path.join(dirpath, base)):
                      print(f'skip: {f} (formato sem updater)')
                      continue
                  with open(os.path.join(dirpath, f), encoding='utf-8') as fh:
                      sig = fh.read().strip()
                  platforms[key] = {
                      'signature': sig,
                      'url': f'https://github.com/{repo}/releases/download/{tag}/{base}',
                  }
                  print(f'updater: {key} -> {base}')

          if not platforms:
              raise SystemExit('ERRO: nenhum artefato de updater (.sig) encontrado')

          # Seção Android: bundle OTA (Capgo) + APK manual.
          import glob
          android = None
          zips = sorted(glob.glob(os.path.join(root, '**', 'forgeboard-web-*.zip'), recursive=True))
          apk = None
          for candidate in sorted(glob.glob(os.path.join(root, '**', 'forgeboard-*.apk'), recursive=True)):
              apk = os.path.basename(candidate)
          if apk is None:
              for dirpath, _, files in os.walk(root):
                  if 'app-debug.apk' in files:
                      apk = 'app-debug.apk'
                      break
          if zips:
              bundle = os.path.basename(zips[0])
              android = {
                  'version': version,
                  'bundleUrl': f'https://github.com/{repo}/releases/download/{tag}/{bundle}',
                  'apkUrl': f'https://github.com/{repo}/releases/download/{tag}/{apk}' if apk else None,
              }
              print(f'android: bundle {bundle}' + (f' + apk {apk}' if apk else ' (sem apk)'))
          elif apk:
              android = {
                  'version': version,
                  'bundleUrl': None,
                  'apkUrl': f'https://github.com/{repo}/releases/download/{tag}/{apk}',
              }
              print(f'android: só apk {apk} (sem bundle OTA)')

          latest = {
              'version': version,
              'notes': f'ForgeBoard {tag}: notas em https://github.com/{repo}/releases/tag/{tag}',
              'pub_date': datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00', 'Z'),
              'platforms': platforms,
          }
          if android is not None:
              latest['android'] = android
          with open(os.path.join(root, 'latest.json'), 'w', encoding='utf-8') as fh:
              json.dump(latest, fh, indent=2)
          print(f'latest.json gerado para a versão {version}')
          EOF
      - uses: softprops/action-gh-release@v2
        with:
          files: dist-artifacts/**/*
          generate_release_notes: true
