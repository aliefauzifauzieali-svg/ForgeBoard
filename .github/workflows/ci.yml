name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      # Browser sem apt primeiro; deps do sistema com tolerância a espelho
      # instável (dl.google.com já quebrou `apt-get update` com Hash Sum
      # mismatch em dia de release — o E2E valida de verdade em seguida).
      - run: npx playwright install chromium
      - run: sudo apt-get update || (sleep 30 && sudo apt-get update) || true; npx playwright install-deps chromium || true
      - run: npm run test:e2e
      - run: npm run test:e2e:pwa
