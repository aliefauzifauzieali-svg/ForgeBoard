# Release multi-plataforma: instaladores desktop (Tauri) + APK Android (Capacitor).
# Dispara ao criar uma tag `v*` (ex.: v1.3.0) ou manualmente (workflow_dispatch).
# iOS fora de escopo. A versão do app empacotado vem de `tauri.conf.json`
# (sincronize com a tag antes de criar a release).
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npm run build
      - run: npm run android:sync
      - run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: apk-android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundle: 'src-tauri/target/release/bundle/**/*'
          - os: ubuntu-latest
            bundle: 'src-tauri/target/release/bundle/**/*'
          - os: macos-latest
            bundle: 'src-tauri/target/release/bundle/**/*'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Dependências do Tauri (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file \
            libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            libwebkit2gtk-4.1-dev
      - run: npm ci
      - name: Build Tauri (gera .sig com a chave de assinatura)
        run: npm run tauri:build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          path: ${{ matrix.bundle }}
          if-no-files-found: error

  release:
    needs: [build-android, build-desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
          merge-multiple: true
      - name: Gerar latest.json do updater (a partir dos .sig)
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python3 - <<'EOF'
          import datetime, json, os

          tag = os.environ.get('TAG_NAME', '')
          version = tag[1:] if tag.startswith('v') else tag
          repo = 'aliefauzifauzieali-svg/ForgeBoard'
          root = 'dist-artifacts'
          platforms = {}

          def triple(filename):
              low = filename.lower()
              if low.endswith('-setup.exe'):
                  arch = 'aarch64' if ('aarch64' in low or 'arm64' in low) else 'x86_64'
                  return f'windows-{arch}'
              if low.endswith('.appimage'):
                  arch = 'aarch64' if ('aarch64' in low or 'arm64' in low) else 'x86_64'
                  return f'linux-{arch}'
              if low.endswith('.app.tar.gz'):
                  arch = 'aarch64' if ('aarch64' in low or 'arm64' in low) else 'x86_64'
                  return f'darwin-{arch}'
              return None

          for dirpath, _, files in os.walk(root):
              for f in sorted(files):
                  if not f.endswith('.sig'):
                      continue
                  base = f[:-4]
                  key = triple(base)
                  if key is None or not os.path.exists(os.path.join(dirpath, base)):
                      print(f'skip: {f} (formato sem updater)')
                      continue
                  with open(os.path.join(dirpath, f), encoding='utf-8') as fh:
                      sig = fh.read().strip()
                  platforms[key] = {
                      'signature': sig,
                      'url': f'https://github.com/{repo}/releases/download/{tag}/{base}',
                  }
                  print(f'updater: {key} -> {base}')

          if not platforms:
              raise SystemExit('ERRO: nenhum artefato de updater (.sig) encontrado')

          latest = {
              'version': version,
              'notes': f'ForgeBoard {tag}: notas em https://github.com/{repo}/releases/tag/{tag}',
              'pub_date': datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00', 'Z'),
              'platforms': platforms,
          }
          with open(os.path.join(root, 'latest.json'), 'w', encoding='utf-8') as fh:
              json.dump(latest, fh, indent=2)
          print(f'latest.json gerado para a versão {version}')
          EOF
      - uses: softprops/action-gh-release@v2
        with:
          files: dist-artifacts/**/*
          generate_release_notes: true
